name: Build FormFill

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/formfill/**"
      - ".github/workflows/build-formfill.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build exe
        working-directory: tools/formfill
        run: python build.py
      - name: Upload FormFill.exe
        uses: actions/upload-artifact@v4
        with:
          name: FormFill-Windows
          path: tools/formfill/dist/FormFill.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build app
        working-directory: tools/formfill
        run: python3 build.py
      - name: Upload FormFill.app
        uses: actions/upload-artifact@v4
        with:
          name: FormFill-macOS
          path: tools/formfill/dist/FormFill.app
